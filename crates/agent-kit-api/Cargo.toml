[package]
name = "agent-kit-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
agent-kit-core = { path = "../agent-kit-core" }
agent-kit-db = { path = "../agent-kit-db" }
async-trait = "0.1"
argon2 = "0.5"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["serde"] }
