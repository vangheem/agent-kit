[package]
name = "agent-kit-actions"
version = "0.1.0"
edition = "2024"
publish = false
description = "Search, shop, flight, and market actions for agent-kit"

[dependencies]
agent-kit-core = { path = "../agent-kit-core" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "http2"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
uuid = "1"
