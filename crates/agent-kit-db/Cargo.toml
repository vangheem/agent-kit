[package]
name = "agent-kit-db"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
agent-kit-core = { path = "../agent-kit-core" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
thiserror = "2"
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
