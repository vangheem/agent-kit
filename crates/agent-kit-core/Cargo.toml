[package]
name = "agent-kit-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Shared types, traits, config, and crypto for agent-kit"

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
