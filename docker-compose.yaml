services:
  db:
    image: postgres:18-alpine
    env_file:
      - .env.compose
      - path: .env.compose.local
        required: false
    ports:
      - "5433:5432"
    volumes:
      # PG 18 keeps data under /var/lib/postgresql, not /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentkit -d agentkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: docker
      dockerfile_inline: |
        FROM rust:1-bookworm
        RUN apt-get update \
          && apt-get install -y --no-install-recommends pkg-config libssl-dev ca-certificates \
          && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
    working_dir: /app
    command: ["sh", "docker/app-dev.sh"]
    env_file:
      - .env.compose
      - path: .env.compose.local
        required: false
    environment:
      DATABASE_URL: postgres://agentkit:agentkit@db:5432/agentkit
      BIND_ADDR: 0.0.0.0:7010
      CARGO_TERM_COLOR: always
    ports:
      - "7010:7010"
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - cargo_target:/app/target
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      target: development
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    working_dir: /app
    command:
      - sh
      - -c
      - |
        set -eu
        if [ ! -x node_modules/.bin/vite ]; then
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        fi
        exec npm run dev -- --host 0.0.0.0 --port 4210
    ports:
      - "4210:4210"
    env_file:
      - .env.compose
      - path: .env.compose.local
        required: false
    environment:
      VITE_API_URL: http://localhost:7010
      NPM_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  cargo_registry:
  cargo_git:
  cargo_target:
  frontend_node_modules:
